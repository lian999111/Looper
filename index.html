    margin: 0;

    -webkit-user-select: none;

  h2 { margin: 0 0 10px 0; font-size: 1.15rem; font-weight: 600; text-align: center; }
  
  #audioFile {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    overflow: hidden;
    z-index: -1;

  .file-btn {
    display: block;
    width: 100%;
    box-sizing: border-box;
    background: #2a2a2a;
    color: var(--accent);
    text-align: center;
    padding: 14px;
    border-radius: 10px;
    font-weight: 600;
    border: 1px dashed var(--accent);
    cursor: pointer;
    font-size: 0.95rem;
  }
  .file-btn:active { background: #383838; }

  #waveform-container {
    position: relative;
    height: 105px;
    background: #0a0a0a;

    overflow: hidden;
    touch-action: none;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .time-display {
    text-align: center;
    font-size: 1.55rem;
    font-variant-numeric: tabular-nums;
    font-weight: bold;
    margin: 8px 0 2px 0;
  }
  .sub-info {
    text-align: center;
    font-size: 0.82rem;
    color: var(--subtext);
    font-variant-numeric: tabular-nums;
  }
  .status-badge {
    text-align: center;
    font-size: 0.8rem;
    color: var(--warn);
    min-height: 1.2em;

  .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .btn-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 8px; }
  .btn-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  button {
    background: #2c2c2c;
    color: var(--text);
    border: none;
    padding: 12px 8px;
    border-radius: 10px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.05s, background 0.15s;
  }
  button:active { transform: scale(0.97); background: #3d3d3d; }
  button:disabled { opacity: 0.4; pointer-events: none; }
  button.primary { background: var(--accent); color: #000; font-size: 1.05rem; }
  button.active-loop { background: var(--warn); color: #000; }
  .nudge-group { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; gap: 6px; }
  .nudge-group span { font-size: 0.8rem; color: var(--subtext); min-width: 42px; }
  .nudge-btn { flex: 1; padding: 9px 4px; font-size: 0.78rem; background: #262626; }
  .slider-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
  input[type="range"] { flex: 1; accent-color: var(--accent); height: 6px; }

  .preset-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid #2e2e2e;
  }
  .preset-list {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 8px;
  }
  .preset-chip {
    display: inline-flex;
    align-items: center;
    background: #292929;
    border: 1px solid #3d3d3d;
    border-radius: 8px;
    overflow: hidden;
  }
  .preset-chip button.load-preset {
    background: transparent;
    padding: 7px 10px;
    font-size: 0.8rem;
    color: var(--accent);
    border-radius: 0;
  }
  .preset-chip button.del-preset {
    background: #382222;
    color: #ff6b6b;
    padding: 7px 8px;
    font-size: 0.75rem;
    border-radius: 0;
  }

<body>

  </div>
  <div class="nudge-group">
    <span>B 微調</span>
    <button class="nudge-btn" onclick="nudge('B', -0.05)" disabled>-50ms</button>
    <button class="nudge-btn" onclick="nudge('B', -0.01)" disabled>-10ms</button>
    <button class="nudge-btn" onclick="nudge('B', 0.01)" disabled>+10ms</button>

<div class="card">
  <div style="display:flex; justify-content:space-between; font-size:0.9rem;">

  </div>
  <div class="btn-row-4">
    <button onclick="setSpeed(0.5)" class="nudge-btn" disabled>0.50x</button>
    <button onclick="setSpeed(0.75)" class="nudge-btn" disabled>0.75x</button>
    <button onclick="setSpeed(0.85)" class="nudge-btn" disabled>0.85x</button>
    <button onclick="setSpeed(1.0)" class="nudge-btn" disabled>1.00x</button>
  </div>
</div>

<audio id="bgKeepAliveAudio" playsinline loop style="display:none;"></audio>

<script>
let audioCtx = null;
let rawBuffer = null;
let loopBuffer = null;
let sourceNode = null;

let isPlaying = false;
let isLooping = true;
let tempo = 1.0;
let currentTrackName = "無縫練琴 Loop";
let currentTrackKey = null;

let loopStart = 0;
let loopEnd = 0;
let savedPresets = [];

let startCtxTime = 0;
let startOffset = 0;
let pauseAudioTime = 0;
let animId = null;
let renderTimer = null;
let wakeLock = null;

const fileInput = document.getElementById('audioFile');
const fileBtn = document.getElementById('fileBtn');
const playBtn = document.getElementById('playBtn');
const loopToggleBtn = document.getElementById('loopToggleBtn');
const setABtn = document.getElementById('setABtn');
const setBBtn = document.getElementById('setBBtn');
const resetABBtn = document.getElementById('resetABBtn');
const addPresetBtn = document.getElementById('addPresetBtn');
const presetList = document.getElementById('presetList');
const speedSlider = document.getElementById('speedSlider');
const speedVal = document.getElementById('speedVal');
const timeDisplay = document.getElementById('timeDisplay');
const abDisplay = document.getElementById('abDisplay');
const statusBadge = document.getElementById('statusBadge');
const bgAudio = document.getElementById('bgKeepAliveAudio');
const canvas = document.getElementById('waveform');
const ctx = canvas.getContext('2d');

let peaks = [];

/**
 * IndexedDB 本地音檔快取與記憶管理
 */
const DB_NAME = "LooperDB";
const STORE_NAME = "audioCache";

function openDB() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open(DB_NAME, 1);
    request.onerror = () => reject(request.error);
    request.onsuccess = () => resolve(request.result);
    request.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };
  });
}

async function saveFileToDB(key, arrayBuffer, fileName) {
  try {
    const db = await openDB();
    const tx = db.transaction(STORE_NAME, "readwrite");
    tx.objectStore(STORE_NAME).put({ arrayBuffer, fileName }, key);
    tx.objectStore(STORE_NAME).put(key, "lastActiveKey");
  } catch (e) {}
}

async function loadFileFromDB(key) {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get(key);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return false;
  }
}

async function getLastActiveKey() {
  try {
    const db = await openDB();
    return new Promise((resolve) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const req = tx.objectStore(STORE_NAME).get("lastActiveKey");
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

function saveTrackState() {
  if (!currentTrackKey || !rawBuffer) return;
  try {
    const state = { loopStart, loopEnd, tempo, isLooping, presets: savedPresets };
    localStorage.setItem(currentTrackKey, JSON.stringify(state));
  } catch (e) {}
}

function loadTrackState(duration) {
  savedPresets = [];
  if (!currentTrackKey) return false;
  try {
    const raw = localStorage.getItem(currentTrackKey);
    if (!raw) return false;
    const state = JSON.parse(raw);

    let restored = false;
    if (typeof state.loopStart === 'number' && typeof state.loopEnd === 'number') {
      if (state.loopStart >= 0 && state.loopEnd <= duration + 0.05 && state.loopEnd - state.loopStart >= 0.1) {
        loopStart = state.loopStart;
        loopEnd = Math.min(duration, state.loopEnd);
        restored = true;
      }
    }
    if (typeof state.tempo === 'number' && state.tempo >= 0.4 && state.tempo <= 1.5) {
      tempo = state.tempo;
      speedSlider.value = tempo;
      speedVal.textContent = tempo.toFixed(2) + 'x';
    }
    if (typeof state.isLooping === 'boolean') {
      isLooping = state.isLooping;
      loopToggleBtn.textContent = isLooping ? "🔁 A-B 循環: 開啟" : "➡️ A-B 循環: 關閉";
      loopToggleBtn.classList.toggle('active-loop', isLooping);
    }
    if (Array.isArray(state.presets)) {
      savedPresets = state.presets;
    }
    renderPresets();
    return restored;
  } catch (e) {
    return false;
  }
}

function renderPresets() {
  presetList.innerHTML = '';
  if (savedPresets.length === 0) {
    presetList.innerHTML = '<span style="font-size:0.78rem; color:#666;">尚無書籤（系統已自動記憶您最後一次設定的 A-B 點）</span>';
    return;
  }
  savedPresets.forEach((p, idx) => {
    const chip = document.createElement('div');
    chip.className = 'preset-chip';

    const loadBtn = document.createElement('button');
    loadBtn.className = 'load-preset';
    loadBtn.textContent = `${p.name} (${formatTime(p.a)}-${formatTime(p.b)})`;
    loadBtn.onclick = () => {
      loopStart = Math.max(0, p.a);
      loopEnd = Math.min(rawBuffer.duration, p.b);
      if (p.tempo) {
        tempo = p.tempo;
        speedSlider.value = tempo;
        speedVal.textContent = tempo.toFixed(2) + 'x';
      }
      saveTrackState();
      triggerRebuildAndPlay(loopStart);
    };

    const delBtn = document.createElement('button');
    delBtn.className = 'del-preset';
    delBtn.textContent = '✕';
    delBtn.onclick = () => {
      savedPresets.splice(idx, 1);
      saveTrackState();
      renderPresets();
    };

    chip.appendChild(loadBtn);
    chip.appendChild(delBtn);
    presetList.appendChild(chip);
  });
}

addPresetBtn.addEventListener('click', () => {
  if (!rawBuffer) return;
  const defaultName = `段落 ${savedPresets.length + 1}`;
  const name = prompt("請輸入此練習段落名稱（例如：前奏、Solo）：", defaultName);
  if (name === null) return;
  savedPresets.push({
    name: name.trim() || defaultName,
    a: loopStart,
    b: loopEnd,
    tempo: tempo
  });
  saveTrackState();
  renderPresets();
});

// App 啟動時自動載入上次快取的音檔與設定
window.addEventListener('DOMContentLoaded', async () => {
  const AudioContextClass = window.AudioContext || window.webkitAudioContext;
  audioCtx = new AudioContextClass({ latencyHint: 'playback' });

  const lastKey = await getLastActiveKey();
  if (lastKey) {
    statusBadge.textContent = "⚡ 正在從本地資料庫還原上次的音訊與 A-B 點...";
    const cached = await loadFileFromDB(lastKey);
    if (cached && cached.arrayBuffer) {
      currentTrackKey = lastKey;
      currentTrackName = cached.fileName.replace(/\.[^/.]+$/, "");
      
      audioCtx.decodeAudioData(cached.arrayBuffer, (decoded) => {
        rawBuffer = decoded;
        loopStart = 0;
        loopEnd = rawBuffer.duration;
        tempo = 1.0;
        speedSlider.value = 1.0;
        speedVal.textContent = '1.00x';

        const hasMemory = loadTrackState(rawBuffer.duration);
        pauseAudioTime = loopStart;

        computePeaks();
        rebuildSeamlessLoopBuffer();
        enableControls();
        renderPresets();
        updateUI();
        updateMediaSession();

        fileBtn.textContent = "🎵 點擊更換音檔 (" + cached.fileName + ")";
        statusBadge.textContent = hasMemory ? `⚡ 已自動還原上次練琴狀態！直接按播放即可` : `✅ 已還原音檔：${cached.fileName}`;
      }, () => {
        statusBadge.textContent = "請點擊上方按鈕載入音訊檔";
      });
      return;
    }
  }
  statusBadge.textContent = "請點擊上方按鈕載入音訊檔";
});

// 產生極低音量背景保活 WAV
function initSilentKeepAliveWav() {
  const sampleRate = 8000;
  const numSamples = sampleRate * 1;
  const buffer = new ArrayBuffer(44 + numSamples * 2);
  const view = new DataView(buffer);
  const writeStr = (off, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(off + i, str.charCodeAt(i));
  };
  writeStr(0, 'RIFF');
  view.setUint32(4, 36 + numSamples * 2, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeStr(36, 'data');
  view.setUint32(40, numSamples * 2, true);
  for (let i = 0; i < numSamples; i++) {
    view.setInt16(44 + i * 2, (i % 2 === 0) ? 1 : -1, true);
  }
  const blob = new Blob([buffer], { type: 'audio/wav' });
  bgAudio.src = URL.createObjectURL(blob);
  bgAudio.volume = 0.01;
}
initSilentKeepAliveWav();

async function requestWakeLock() {
  if ('wakeLock' in navigator) {
    try { wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
  }
}
function releaseWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}

function updateMediaSession() {
  if (!('mediaSession' in navigator)) return;
  navigator.mediaSession.metadata = new MediaMetadata({
    title: currentTrackName,
    artist: `A-B Loop (${tempo.toFixed(2)}x 原調)`,
    album: '無縫練琴 Looper'
  });
  navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';

  navigator.mediaSession.setActionHandler('play', () => {
    if (!isPlaying) startAudio(pauseAudioTime);
  });
  navigator.mediaSession.setActionHandler('pause', () => {
    if (isPlaying) stopAudio();
  });
  navigator.mediaSession.setActionHandler('previoustrack', () => {
    if (isPlaying) startAudio(loopStart);
    else { pauseAudioTime = loopStart; updateUI(); }
  });
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') {
    if (isPlaying) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      requestWakeLock();
      tick();
    } else {
      updateUI();
    }
  }
});

fileInput.addEventListener('click', () => {
  fileInput.value = '';
});

fileInput.addEventListener('change', (e) => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;

  if (isPlaying) stopAudio();
  currentTrackName = file.name.replace(/\.[^/.]+$/, "");
  currentTrackKey = `looper_mem_${file.name}_${file.size}`;
  fileBtn.textContent = "⏳ 正在讀取並快取音訊...";
  statusBadge.textContent = `正在處理：${file.name}`;

  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }

  const reader = new FileReader();
  reader.onload = async function(evt) {
    const arrayBuffer = evt.target.result;
    
    // 存入 IndexedDB 快取
    await saveFileToDB(currentTrackKey, arrayBuffer, file.name);

    audioCtx.decodeAudioData(
      arrayBuffer,
      function(decoded) {
        rawBuffer = decoded;
        loopStart = 0;
        loopEnd = rawBuffer.duration;
        tempo = 1.0;
        speedSlider.value = 1.0;
        speedVal.textContent = '1.00x';

        const hasMemory = loadTrackState(rawBuffer.duration);
        pauseAudioTime = loopStart;

        computePeaks();
        rebuildSeamlessLoopBuffer();
        enableControls();
        renderPresets();
        updateUI();
        updateMediaSession();

        fileBtn.textContent = "🎵 點擊更換音檔 (" + file.name + ")";
        statusBadge.textContent = hasMemory ? `⚡ 已自動恢復記憶區間與速度！` : `✅ 載入並快取成功！`;
      },
      function(err) {
        alert("解碼失敗：請確認選擇的是音訊檔（如 MP3、M4A、WAV）。");
        fileBtn.textContent = "📁 點擊選擇 / 更換音訊檔";
        statusBadge.textContent = "❌ 音訊解碼失敗";
      }
    );
  };
  reader.readAsArrayBuffer(file);
});

function enableControls() {
  document.querySelectorAll('button, input[type="range"]').forEach(el => el.disabled = false);
}

function rebuildSeamlessLoopBuffer() {
  if (!rawBuffer) return;

  const sr = rawBuffer.sampleRate;
  const numCh = rawBuffer.numberOfChannels;
  const startSample = Math.max(0, Math.floor(loopStart * sr));
  const endSample = Math.min(rawBuffer.length, Math.floor(loopEnd * sr));
  const segLen = endSample - startSample;

  if (segLen < sr * 0.05) return;

  const fadeSamples = Math.min(Math.floor(sr * 0.004), Math.floor(segLen / 4));

  if (Math.abs(tempo - 1.0) < 0.01) {
    loopBuffer = audioCtx.createBuffer(numCh, segLen, sr);
    for (let ch = 0; ch < numCh; ch++) {
      const src = rawBuffer.getChannelData(ch);
      const dst = loopBuffer.getChannelData(ch);
      for (let i = 0; i < segLen; i++) {
        dst[i] = src[startSample + i];
      }
      for (let i = 0; i < fadeSamples; i++) {
        const t = i / fadeSamples;
        const tailIdx = segLen - fadeSamples + i;
        dst[tailIdx] = dst[tailIdx] * Math.cos(t * Math.PI * 0.5) + src[startSample] * Math.sin(t * Math.PI * 0.5);
      }
    }
    return;
  }

  const winSize = Math.floor(sr * 0.040);
  const halfWin = Math.floor(winSize / 2);
  const searchRange = Math.floor(sr * 0.012);
  const outLen = Math.max(winSize, Math.floor(segLen / tempo));

  loopBuffer = audioCtx.createBuffer(numCh, outLen, sr);

  const hann = new Float32Array(winSize);
  for (let i = 0; i < winSize; i++) {
    hann[i] = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (winSize - 1)));
  }

  const chSrc = [];
  const chDst = [];
  for (let ch = 0; ch < numCh; ch++) {
    chSrc.push(rawBuffer.getChannelData(ch));
    chDst.push(loopBuffer.getChannelData(ch));
  }

  let outPos = 0;
  let inPos = startSample;

  while (outPos + winSize < outLen) {
    const idealInPos = startSample + Math.floor(outPos * tempo);

    let bestOffset = 0;
    if (outPos > 0 && idealInPos + winSize + searchRange < rawBuffer.length) {
      let maxCorr = -Infinity;
      const refCh = chSrc[0];
      const prevOverlapStart = inPos + halfWin;

      for (let off = -searchRange; off <= searchRange; off += 4) {
        const candStart = idealInPos + off;
        if (candStart < startSample || candStart + halfWin >= rawBuffer.length) continue;
        let corr = 0;
        for (let k = 0; k < halfWin; k += 8) {
          corr += refCh[prevOverlapStart + k] * refCh[candStart + k];
        }
        if (corr > maxCorr) {
          maxCorr = corr;
          bestOffset = off;
        }
      }
    }

    inPos = Math.min(rawBuffer.length - winSize - 1, Math.max(startSample, idealInPos + bestOffset));

    for (let ch = 0; ch < numCh; ch++) {
      const src = chSrc[ch];
      const dst = chDst[ch];
      for (let i = 0; i < winSize; i++) {
        dst[outPos + i] += src[inPos + i] * hann[i];
      }
    }

    outPos += halfWin;
  }

  for (let ch = 0; ch < numCh; ch++) {
    const dst = chDst[ch];
    const headVal = dst[0];
    for (let i = 0; i < fadeSamples; i++) {
      const t = i / fadeSamples;
      const idx = outLen - fadeSamples + i;
      if (idx >= 0 && idx < outLen) {
        dst[idx] = dst[idx] * (1 - t) + headVal * t;
      }
    }
  }
}

function getCurrentAudioTime() {
  if (!rawBuffer) return 0;
  if (!isPlaying) return pauseAudioTime;

  const elapsedReal = audioCtx.currentTime - startCtxTime;
  const elapsedInLoopBuf = startOffset + elapsedReal;
  const loopBufDur = loopBuffer ? loopBuffer.duration : (loopEnd - loopStart) / tempo;

  let curInLoopBuf = elapsedInLoopBuf;
  if (isLooping && loopBufDur > 0) {
    curInLoopBuf = elapsedInLoopBuf % loopBufDur;
  } else if (curInLoopBuf >= loopBufDur) {
    stopAudio();
    pauseAudioTime = loopStart;
    return loopStart;
  }

  const mappedTime = loopStart + curInLoopBuf * tempo;
  return Math.min(loopEnd, Math.max(loopStart, mappedTime));
}

function startAudio(targetOriginalTime) {
  if (!rawBuffer || !loopBuffer) return;

  bgAudio.play().catch(() => {});

  if (audioCtx.state === 'suspended') audioCtx.resume();
  if (sourceNode) {
    try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
  }

  sourceNode = audioCtx.createBufferSource();
  sourceNode.buffer = loopBuffer;
  sourceNode.loop = isLooping;
  sourceNode.loopStart = 0;
  sourceNode.loopEnd = loopBuffer.duration;
  sourceNode.connect(audioCtx.destination);

  let clampedTime = targetOriginalTime;
  if (clampedTime < loopStart || clampedTime >= loopEnd) {
    clampedTime = loopStart;
  }
  const bufOffset = Math.max(0, Math.min(loopBuffer.duration - 0.01, (clampedTime - loopStart) / tempo));

  startCtxTime = audioCtx.currentTime;
  startOffset = bufOffset;
  sourceNode.start(0, bufOffset);

  isPlaying = true;
  playBtn.textContent = "⏸ 暫停";

  requestWakeLock();
  updateMediaSession();

  cancelAnimationFrame(animId);
  tick();
}

function stopAudio() {
  if (!isPlaying) return;
  pauseAudioTime = getCurrentAudioTime();
  if (sourceNode) {
    try { sourceNode.stop(); sourceNode.disconnect(); } catch (e) {}
    sourceNode = null;
  }
  bgAudio.pause();
  releaseWakeLock();

  isPlaying = false;
  playBtn.textContent = "▶ 播放";
  updateMediaSession();
  cancelAnimationFrame(animId);
  updateUI();
}

function triggerRebuildAndPlay(targetPos) {
  saveTrackState();
  statusBadge.textContent = "⚡ 正在合成無縫音訊區間...";
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    rebuildSeamlessLoopBuffer();
    if (isPlaying) {
      startAudio(targetPos);
    } else {
      pauseAudioTime = targetPos;
      updateUI();
    }
    const lenSec = (loopEnd - loopStart).toFixed(1);
    statusBadge.textContent = `💾 已自動快取並記憶：${lenSec} 秒 (${tempo.toFixed(2)}x 原調)`;
  }, 15);
}

playBtn.addEventListener('click', () => {
  if (isPlaying) stopAudio();
  else startAudio(pauseAudioTime);
});

loopToggleBtn.addEventListener('click', () => {
  isLooping = !isLooping;
  loopToggleBtn.textContent = isLooping ? "🔁 A-B 循環: 開啟" : "➡️ A-B 循環: 關閉";
  loopToggleBtn.classList.toggle('active-loop', isLooping);
  if (isPlaying && sourceNode) {
    sourceNode.loop = isLooping;
  }
  saveTrackState();
  updateUI();
});

setABtn.addEventListener('click', () => {
  const cur = getCurrentAudioTime();
  if (cur < loopEnd - 0.1) {
    loopStart = cur;
    triggerRebuildAndPlay(cur);
  }
});

setBBtn.addEventListener('click', () => {
  const cur = getCurrentAudioTime();
  if (cur > loopStart + 0.1) {
    loopEnd = cur;
    triggerRebuildAndPlay(loopStart);
  }
});

resetABBtn.addEventListener('click', () => {
  if (!rawBuffer) return;
  const cur = getCurrentAudioTime();
  loopStart = 0;
  loopEnd = rawBuffer.duration;
  triggerRebuildAndPlay(cur);
});

window.nudge = function(point, delta) {
  if (!rawBuffer) return;
  const cur = getCurrentAudioTime();
  if (point === 'A') {
    loopStart = Math.max(0, Math.min(loopEnd - 0.1, loopStart + delta));
  } else {
    loopEnd = Math.min(rawBuffer.duration, Math.max(loopStart + 0.1, loopEnd + delta));
  }
  triggerRebuildAndPlay(cur);
};

window.setSpeed = function(val) {
  speedSlider.value = val;
  applySpeedChange(val);
};

speedSlider.addEventListener('input', (e) => {
  const val = parseFloat(e.target.value);
  speedVal.textContent = val.toFixed(2) + 'x';
});

speedSlider.addEventListener('change', (e) => {
  applySpeedChange(parseFloat(e.target.value));
});

function applySpeedChange(newTempo) {
  const cur = getCurrentAudioTime();
  tempo = newTempo;
  speedVal.textContent = tempo.toFixed(2) + 'x';
  triggerRebuildAndPlay(cur);
}

let isDragging = false;
function seekFromEvent(e) {
  if (!rawBuffer) return;
  const rect = canvas.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  const ratio = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  let seekTime = ratio * rawBuffer.duration;

  if (seekTime < loopStart || seekTime > loopEnd) {
    seekTime = Math.max(loopStart, Math.min(loopEnd - 0.05, seekTime));
  }

  if (isPlaying) {
    startAudio(seekTime);
  } else {
    pauseAudioTime = seekTime;
    updateUI();
  }
}

canvas.addEventListener('pointerdown', (e) => { isDragging = true; seekFromEvent(e); });
window.addEventListener('pointermove', (e) => { if (isDragging) seekFromEvent(e); });
window.addEventListener('pointerup', () => { isDragging = false; });

function computePeaks() {
  const raw = rawBuffer.getChannelData(0);
  const bins = 300;
  const blockSize = Math.floor(raw.length / bins);
  peaks = [];
  for (let i = 0; i < bins; i++) {
    let max = 0;
    const start = i * blockSize;
    for (let j = 0; j < blockSize; j += 10) {
      const v = Math.abs(raw[start + j]);
      if (v > max) max = v;
    }
    peaks.push(max);
  }
}

function drawWaveform(curTime) {
  const dpr = window.devicePixelRatio || 1;
  const width = canvas.clientWidth * dpr;
  const height = canvas.clientHeight * dpr;
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }

  ctx.clearRect(0, 0, width, height);
  if (!rawBuffer) return;

  const dur = rawBuffer.duration;
  const aX = (loopStart / dur) * width;
  const bX = (loopEnd / dur) * width;
  const curX = (curTime / dur) * width;

  if (isLooping) {
    ctx.fillStyle = 'rgba(0, 230, 118, 0.16)';
    ctx.fillRect(aX, 0, bX - aX, height);
  }

  const barW = width / peaks.length;
  for (let i = 0; i < peaks.length; i++) {
    const x = i * barW;
    const h = Math.max(2, peaks[i] * height * 0.85);
    ctx.fillStyle = (isLooping && x >= aX && x <= bX) ? '#00e676' : '#444';
    ctx.fillRect(x, (height - h) / 2, Math.max(1, barW - 1), h);
  }

  ctx.fillStyle = '#ff9100';
  ctx.fillRect(aX, 0, 2.5 * dpr, height);
  ctx.fillRect(bX - 2.5 * dpr, 0, 2.5 * dpr, height);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(curX - 1.2 * dpr, 0, 2.4 * dpr, height);
}

function formatTime(sec) {
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  const ms = Math.floor((sec % 1) * 100);
  return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
}

function updateUI() {
  const cur = getCurrentAudioTime();
  timeDisplay.textContent = formatTime(cur);
  abDisplay.innerHTML = `A: ${formatTime(loopStart)} &nbsp;|&nbsp; B: ${formatTime(loopEnd)}`;
  drawWaveform(cur);
}

function tick() {
  if (!isPlaying || document.visibilityState === 'hidden') return;
  updateUI();
  animId = requestAnimationFrame(tick);
}
</script>
</body>
</html>
